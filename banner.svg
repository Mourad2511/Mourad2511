  <rect x="58" y="132" width="230" height="4" rx="2" fill="url(#g)"/>
  <text x="56" y="176" font-size="22" fill="#C9D3E6">AI &amp; Automation Engineer · n8n · Agents IA</text>
  <text x="56" y="214" font-size="17" fill="#98A3B8">5 workflows en production · 40-50 h/semaine économisées · 100 % d'adoption</text>
  <g transform="translate(56,240)">
    <rect width="372" height="30" rx="15" fill="#13261F" stroke="#4CC98D"/>
    <circle cx="18" cy="15" r="5" fill="#4CC98D"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
