<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2440E6" opacity=".18"/></pattern>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2440E6"/><stop offset="1" stop-color="#E8962E"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#0E1726"/>
