  <g fill="none" stroke="#2E3B57" stroke-width="2">
    <path id="p1" d="M690 70 C760 70 760 150 830 150"/>
    <path id="p2" d="M690 230 C760 230 760 150 830 150"/>
    <path id="p3" d="M890 150 C950 150 950 90 1010 90"/>
    <path id="p4" d="M890 150 C950 150 950 215 1010 215"/>
    <path id="p5" d="M1070 90 C1110 90 1110 150 1150 150"/>
  </g>
  <g font-size="13" font-family="Consolas, monospace" fill="#E7ECF5">
    <rect x="600" y="52" width="90" height="36" rx="8" fill="#111A2D" stroke="#2E3B57"/><text x="645" y="75" text-anchor="middle">Webhook</text>
    <rect x="600" y="212" width="90" height="36" rx="8" fill="#111A2D" stroke="#2E3B57"/><text x="645" y="235" text-anchor="middle">API</text>
    <rect x="830" y="132" width="60" height="36" rx="8" fill="#1B2547" stroke="#8394FF"/><text x="860" y="155" text-anchor="middle" fill="#8394FF">IA</text>
    <rect x="1010" y="72" width="60" height="36" rx="8" fill="#111A2D" stroke="#2E3B57"/><text x="1040" y="95" text-anchor="middle">CRM</text>
    <rect x="1010" y="197" width="60" height="36" rx="8" fill="#111A2D" stroke="#E8962E" stroke-dasharray="4 3"/><text x="1040" y="220" text-anchor="middle" fill="#F4B35E">Humain</text>
  </g>
  <g fill="#F4B35E">
    <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin=".4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin="1.4s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
